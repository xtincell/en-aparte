name: Vérifier le parcours En aparté
on:
  push:
    branches: [main]
    paths: ['En-aparte.html', 'tests/parcours.mjs', '.github/workflows/parcours.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le navigateur de test isolé
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Parcours dans Chromium
        run: node tests/parcours.mjs
