# Sert uniquement En-aparte.html. Toute autre adresse répond 404.
server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Les en-têtes sont déclarés ici seulement : un add_header dans un bloc
    # location remplacerait toute cette liste.
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Le navigateur garde la page mais revalide à chaque visite (ETag) :
    # une nouvelle version est visible dès son déploiement.
    add_header Cache-Control "no-cache" always;

    location = / { try_files /En-aparte.html =404; }
    location = /En-aparte.html { try_files $uri =404; }
    location / { return 404; }
}
